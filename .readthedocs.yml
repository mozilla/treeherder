# https://docs.readthedocs.io/en/latest/config-file/index.html
version: 2
build:
  os: ubuntu-22.04
  tools:
    python: '3.10'
  jobs:
    install:
        # Since the install step is overridden, pip is no longer updated automatically.
        - pip install --upgrade pip
        - pip install -e ".[docs]"
