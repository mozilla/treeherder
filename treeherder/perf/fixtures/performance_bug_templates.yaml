- model: perf.PerformanceBugTemplate
  pk: 1
  fields:
    framework: 1
    keywords: perf, perf-alert, regression, talos-regression
    default_component: Performance
    default_product: Testing
    text: |
      Perfherder has detected {{ changesSummary }} from {{ pushDescription }}

      ### What we need from you by {{ acknowledgeByDate }}
      Reply to the needinfo with one of these:
      - **Fix:** you will land a fix.
      - **Back out:** you will back out the patch.
      - **Accept:** the regression is expected or worth it. Tell us why.

      Not sure? Ask in [#perf-help](https://mozilla.enterprise.slack.com/archives/C03U19JCSFQ) and we will help you decide.

      If there is no reply by {{ acknowledgeByDate }}, the patch can be backed out under our [regression policy](https://www.mozilla.org/en-US/about/governance/policies/regressions/).

      {{ alertSummary }}

      ### How to investigate

      1. See the [guide to handling regression bugs](https://firefox-source-docs.mozilla.org/testing/perfdocs/perftest-in-a-nutshell.html#help-i-have-a-regression-what-do-i-do).
      2. Review the [alert summary]({{ alertHref }}) for all affected tests, graphs, and comparisons.
      3. Use [PerfCompare]({{ perfCompareURL }}) to get a detailed overview of the before and after performance of the commit.
      4. Run the tests on try using `./mach try perf --alert {{ alertSummaryId }}` ([docs](https://firefox-source-docs.mozilla.org/testing/perfdocs/mach-try-perf.html#running-alert-tests)).
      5. Run the tests locally using `./mach perftest {{ alertSummaryId }}`.
      6. [Get a profile](https://firefox-source-docs.mozilla.org/testing/perfdocs/perftest-in-a-nutshell.html#using-the-firefox-profiler) to compare what Firefox is doing before and after the change.

      For questions, please contact {{ user }}, or ask in [#perf-help](https://mozilla.enterprise.slack.com/archives/C03U19JCSFQ) / [#perftest](https://matrix.to/#/#perftest:mozilla.org).
    critical_text: |
      Perfherder has detected a {{ framework }} performance regression from {{ pushDescription }}

      We would like to inform you that we are requesting an immediate back out from sheriffs@mozilla.bugs of the current patch due to performance regressions on the following critical test(s):  {{ criticalTests }}.

      Please review our [regression policy](https://www.mozilla.org/en-US/about/governance/policies/regressions/) for additional details regarding the reasons for the immediate backout.

      We need your help with resolving {{ changesSummary }}.

      {{ alertSummary }}

      ### How to investigate

      1. See the [guide to handling regression bugs](https://firefox-source-docs.mozilla.org/testing/perfdocs/perftest-in-a-nutshell.html#help-i-have-a-regression-what-do-i-do).
      2. Review the [alert summary]({{ alertHref }}) for all affected tests, graphs, and comparisons.
      3. Use [PerfCompare]({{ perfCompareURL }}) to get a detailed overview of the before and after performance of the commit.
      4. Run the tests on try using `./mach try perf --alert {{ alertSummaryId }}` ([docs](https://firefox-source-docs.mozilla.org/testing/perfdocs/mach-try-perf.html#running-alert-tests)).
      5. Run the tests locally using `./mach perftest {{ alertSummaryId }}`.
      6. [Get a profile](https://firefox-source-docs.mozilla.org/testing/perfdocs/perftest-in-a-nutshell.html#using-the-firefox-profiler) to compare what Firefox is doing before and after the change.

      For questions, please contact {{ user }}, or ask in [#perf-help](https://mozilla.enterprise.slack.com/archives/C03U19JCSFQ) / [#perftest](https://matrix.to/#/#perftest:mozilla.org).
    no_action_required_text: |
      Perfherder has detected a {{ framework }} performance change from {{ pushDescription }}

      _**No action is required from the author; this comment is provided for informational purposes only.**_

      {{ changesSummary }}.

      {{ alertSummary }}

      ### Need Help or Information?

      If you have any questions, please reach out to {{ user }}. Alternatively, you can find help on Slack by joining [#perf-help](https://mozilla.enterprise.slack.com/archives/C03U19JCSFQ), and on Matrix you can find help by joining [#perftest](https://matrix.to/#/#perftest:mozilla.org).

      Details of the alert can be found in the [alert summary]({{ alertHref }}), including links to graphs and comparisons for each of the affected tests.
